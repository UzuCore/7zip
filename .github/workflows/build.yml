name: Build 7-Zip

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build UnEGG backend
        run: |
          cmake -S CPP/7zip/Archive/AlzEgg/third_party/unegg -B CPP/7zip/Archive/AlzEgg/third_party/unegg/build -DCMAKE_BUILD_TYPE=Release
          cmake --build CPP/7zip/Archive/AlzEgg/third_party/unegg/build --parallel 2

      - name: Build 7zz
        run: make -j2 -f makefile.gcc
        working-directory: CPP/7zip/Bundles/Alone2

      - name: Stage build artifact
        run: |
          mkdir -p "dist/linux-${{ matrix.arch }}"
          cp CPP/7zip/Bundles/Alone2/_o/7zz "dist/linux-${{ matrix.arch }}/"
          cp DOC/License.txt DOC/copying.txt DOC/unRarLicense.txt "dist/linux-${{ matrix.arch }}/"
          cp CPP/7zip/Archive/AlzEgg/third_party/unegg/LICENSE.txt "dist/linux-${{ matrix.arch }}/UnEGG-LICENSE.txt"

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: 7zip-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - runner: windows-11-arm
            arch: arm64
            vs_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build 7zz.exe, 7z.dll, and 7zFM.exe
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          VS_COMPONENT: ${{ matrix.vs_component }}
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires $env:VS_COMPONENT -property installationPath | Select-Object -First 1
          if (-not $vsPath) {
            throw "Visual Studio tools for $env:BUILD_ARCH were not found on the runner."
          }

          $env:VCVARS = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path -LiteralPath $env:VCVARS)) {
            throw "Visual Studio developer setup script was not found: $env:VCVARS"
          }

          $buildScript = Join-Path $env:RUNNER_TEMP "build-7zip-$env:BUILD_ARCH.cmd"
          $scriptText = @'
          @echo off
          call "%VCVARS%" %BUILD_ARCH%
          if errorlevel 1 exit /b 1
          cd /d "%GITHUB_WORKSPACE%\CPP\7zip\Archive\AlzEgg\third_party\unegg"
          if errorlevel 1 exit /b 1
          cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          if errorlevel 1 exit /b 1
          cmake --build build --parallel 2
          if errorlevel 1 exit /b 1
          cd /d "%GITHUB_WORKSPACE%\CPP\7zip\Bundles\Alone2"
          if errorlevel 1 exit /b 1
          nmake /nologo /f makefile PLATFORM=%BUILD_ARCH%
          if errorlevel 1 exit /b 1
          cd /d "%GITHUB_WORKSPACE%\CPP\7zip\Bundles\Format7zF"
          if errorlevel 1 exit /b 1
          nmake /nologo /f makefile PLATFORM=%BUILD_ARCH%
          if errorlevel 1 exit /b 1
          cd /d "%GITHUB_WORKSPACE%\CPP\7zip\UI\FileManager"
          if errorlevel 1 exit /b 1
          nmake /nologo /f makefile PLATFORM=%BUILD_ARCH%
          if errorlevel 1 exit /b 1
          cd /d "%GITHUB_WORKSPACE%\CPP\7zip\Bundles\SFXSetup"
          if errorlevel 1 exit /b 1
          nmake /nologo /f makefile PLATFORM=%BUILD_ARCH%
          if errorlevel 1 exit /b 1
          '@
          [IO.File]::WriteAllText($buildScript, $scriptText, [Text.Encoding]::ASCII)

          $buildLog = Join-Path $env:RUNNER_TEMP "build-7zip-$env:BUILD_ARCH.log"
          & $env:ComSpec /d /c $buildScript 2>&1 | Tee-Object -FilePath $buildLog
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            "Windows $env:BUILD_ARCH build failed with exit code $buildExitCode. Last build output:" | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content -LiteralPath $buildLog -Tail 120 | Add-Content $env:GITHUB_STEP_SUMMARY
            $failureLines = Select-String -Path $buildLog -Pattern 'warning [A-Z]+\d+|warning:|error [A-Z]+\d+|fatal error|: error:|LNK\d+|Undefined symbols for architecture|ld: ' | Select-Object -Last 12 | ForEach-Object { $_.Line }
            if (-not $failureLines) {
              $failureLines = Get-Content -LiteralPath $buildLog -Tail 8
            }
            $details = ($failureLines -join "`n")
            if ($details.Length -gt 2400) {
              $details = $details.Substring(0, 2400)
            }
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows build output::$details"
            throw "Windows $env:BUILD_ARCH build failed with exit code $buildExitCode."
          }

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "dist\windows-$env:BUILD_ARCH"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item "CPP\7zip\Bundles\Alone2\$env:BUILD_ARCH\7zz.exe" $artifactDir
          Copy-Item "CPP\7zip\Bundles\Format7zF\$env:BUILD_ARCH\7z.dll" $artifactDir
          Copy-Item "CPP\7zip\UI\FileManager\$env:BUILD_ARCH\7zFM.exe" $artifactDir
          Copy-Item 'DOC\License.txt' $artifactDir
          Copy-Item 'DOC\copying.txt' $artifactDir
          Copy-Item 'DOC\unRarLicense.txt' $artifactDir
          Copy-Item 'CPP\7zip\Archive\AlzEgg\third_party\unegg\LICENSE.txt' (Join-Path $artifactDir 'UnEGG-LICENSE.txt')
          $portableArchive = Join-Path $env:RUNNER_TEMP "7zip-windows-$env:BUILD_ARCH.7z"
          Push-Location $artifactDir
          try {
            & (Join-Path $artifactDir '7zz.exe') a -t7z $portableArchive '*'
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to package Windows $env:BUILD_ARCH portable archive."
            }
          }
          finally {
            Pop-Location
          }
          Move-Item -LiteralPath $portableArchive -Destination (Join-Path $artifactDir "7zip-windows-$env:BUILD_ARCH.7z")

          $versionHeader = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'C\7zVersion.h') -Raw
          $versionMajor = [regex]::Match($versionHeader, '(?m)^#define MY_VER_MAJOR (\d+)').Groups[1].Value
          $versionMinor = [regex]::Match($versionHeader, '(?m)^#define MY_VER_MINOR (\d+)').Groups[1].Value
          if (-not $versionMajor -or -not $versionMinor) {
            throw 'Could not read the product version from C/7zVersion.h.'
          }
          $packageVersion = "$versionMajor.$versionMinor.$env:GITHUB_RUN_NUMBER"
          $wixDir = Join-Path $env:RUNNER_TEMP 'wix'
          dotnet tool install --tool-path $wixDir wix --version 4.0.5
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not install WiX Toolset 4.0.5.'
          }
          $wix = Join-Path $wixDir 'wix.exe'
          & $wix extension add --global WixToolset.UI.wixext/4.0.5
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not install the WiX standard installer dialogs.'
          }

          $licenseText = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'DOC\License.txt'))
          $licenseText = $licenseText.Replace('\', '\\').Replace('{', '\{').Replace('}', '\}')
          $licenseText = [regex]::Replace($licenseText, "`r?`n", '\line ')
          $licenseRtf = Join-Path $env:RUNNER_TEMP '7zip-license.rtf'
          $licenseRtfText = "{\rtf1\ansi\deff0{\fonttbl{\f0\fnil Arial;}}\viewkind4\uc1\f0\fs18 $licenseText}"
          [IO.File]::WriteAllText($licenseRtf, $licenseRtfText, [Text.Encoding]::ASCII)

          $msiName = "7zip-windows-$env:BUILD_ARCH.msi"
          $msiPath = Join-Path $artifactDir $msiName
          & $wix build -arch $env:BUILD_ARCH `
            -d "ProductName=7-Zip UzuCore ($env:BUILD_ARCH)" `
            -d "PackageVersion=$packageVersion" `
            -d "PayloadDir=$artifactDir" `
            -d "LicenseRtf=$licenseRtf" `
            -ext WixToolset.UI.wixext `
            -o $msiPath `
            (Join-Path $env:GITHUB_WORKSPACE 'Installer\WindowsProduct.wxs')
          if ($LASTEXITCODE -ne 0) {
            throw "WiX failed to build the $env:BUILD_ARCH installer MSI."
          }

          $setupSfx = Join-Path $env:GITHUB_WORKSPACE "CPP\7zip\Bundles\SFXSetup\$env:BUILD_ARCH\7zS.sfx"
          if (-not (Test-Path -LiteralPath $setupSfx)) {
            throw "The $env:BUILD_ARCH setup SFX module was not built: $setupSfx"
          }
          $setupPayload = Join-Path $env:RUNNER_TEMP "7zip-installer-$env:BUILD_ARCH"
          New-Item -ItemType Directory -Force -Path $setupPayload | Out-Null
          Copy-Item -LiteralPath $msiPath -Destination (Join-Path $setupPayload $msiName)
          $setupArchive = Join-Path $env:RUNNER_TEMP "7zip-installer-$env:BUILD_ARCH.7z"
          Push-Location $setupPayload
          try {
            & (Join-Path $artifactDir '7zz.exe') a -t7z $setupArchive $msiName
            if ($LASTEXITCODE -ne 0) {
              throw "Could not package the $env:BUILD_ARCH MSI for the setup EXE."
            }
          }
          finally {
            Pop-Location
          }

          $setupConfig = Join-Path $env:RUNNER_TEMP "7zip-installer-$env:BUILD_ARCH-config.txt"
          $setupConfigText = @"
          ;!@Install@!UTF-8!
          Title="7-Zip UzuCore Setup"
          RunProgram="msiexec.exe /i $msiName"
          ;!@InstallEnd@!
          "@
          [IO.File]::WriteAllText($setupConfig, $setupConfigText, [Text.Encoding]::ASCII)
          $setupExe = Join-Path $artifactDir "7zip-windows-$env:BUILD_ARCH.exe"
          $setupStream = [IO.File]::Create($setupExe)
          try {
            foreach ($sourceFile in @($setupSfx, $setupConfig, $setupArchive)) {
              $sourceStream = [IO.File]::OpenRead($sourceFile)
              try {
                $sourceStream.CopyTo($setupStream)
              }
              finally {
                $sourceStream.Dispose()
              }
            }
          }
          finally {
            $setupStream.Dispose()
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: 7zip-windows-${{ matrix.arch }}
          path: dist/windows-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: arm64
            cmake_arch: arm64
            make_arch: "-arch arm64"
          - runner: macos-15-intel
            arch: x64
            cmake_arch: x86_64
            make_arch: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build UnEGG backend
        run: |
          cmake -S CPP/7zip/Archive/AlzEgg/third_party/unegg -B CPP/7zip/Archive/AlzEgg/third_party/unegg/build -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release
          cmake --build CPP/7zip/Archive/AlzEgg/third_party/unegg/build --parallel 2

      - name: Build 7zz
        run: |
          set -o pipefail
          build_log="$RUNNER_TEMP/macos-build.log"
          if make -j2 -f makefile.gcc MY_ARCH="${{ matrix.make_arch }}" 2>&1 | tee "$build_log"; then
            exit 0
          else
            build_status=${PIPESTATUS[0]}
            build_details=$(grep -A 20 -E 'warning [A-Z]+[0-9]+|warning:|error [A-Z]+[0-9]+|fatal error|: error:|Undefined symbols for architecture|ld: ' "$build_log" | tail -n 20 || true)
            if [[ -z "$build_details" ]]; then
              build_details=$(tail -n 8 "$build_log")
            fi
            build_details=${build_details:0:2400}
            build_details=${build_details//'%'/'%25'}
            build_details=${build_details//$'\r'/'%0D'}
            build_details=${build_details//$'\n'/'%0A'}
            echo "::error title=macOS build output::$build_details"
            exit "$build_status"
          fi
        working-directory: CPP/7zip/Bundles/Alone2

      - name: Stage build artifact
        run: |
          mkdir -p "dist/macos-${{ matrix.arch }}"
          cp CPP/7zip/Bundles/Alone2/_o/7zz "dist/macos-${{ matrix.arch }}/"
          cp DOC/License.txt DOC/copying.txt DOC/unRarLicense.txt "dist/macos-${{ matrix.arch }}/"
          cp CPP/7zip/Archive/AlzEgg/third_party/unegg/LICENSE.txt "dist/macos-${{ matrix.arch }}/UnEGG-LICENSE.txt"

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: 7zip-macos-${{ matrix.arch }}
          path: dist/macos-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish date-based release
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs:
      - linux
      - windows
      - macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: 7zip-*
          path: release-assets

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p release
          for artifact_dir in release-assets/7zip-*; do
            asset_name="${artifact_dir##*/}"
            case "$asset_name" in
              7zip-linux-*|7zip-macos-*)
                tar -C "$artifact_dir" -cJf "release/${asset_name}.tar.xz" .
                ;;
              7zip-windows-*)
                cp "$artifact_dir/${asset_name}.7z" "release/${asset_name}.7z"
                cp "$artifact_dir/${asset_name}.exe" "release/${asset_name}.exe"
                cp "$artifact_dir/${asset_name}.msi" "release/${asset_name}.msi"
                ;;
              *)
                echo "Unexpected build artifact: $asset_name" >&2
                exit 1
                ;;
            esac
          done

      - name: Generate date-based release metadata
        id: release-meta
        run: |
          release_date="$(TZ=Asia/Seoul date +%Y.%m.%d)"
          release_title_date="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          echo "date=${release_title_date}" >> "$GITHUB_OUTPUT"
          echo "tag=build-${release_date}" >> "$GITHUB_OUTPUT"
          echo "title=7-Zip ${release_title_date}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.release-meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release-meta.outputs.title }}
          RELEASE_DATE: ${{ steps.release-meta.outputs.date }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { owner, repo } = context.repo;
            const dateTag = process.env.RELEASE_TAG;
            const files = fs.readdirSync("release").filter((file) => file.endsWith(".tar.xz") || /\.(7z|exe|msi)$/.test(file)).sort();

            if (files.length !== 10) {
              throw new Error(`Expected 10 release assets, found ${files.length}: ${files.join(", ")}`);
            }

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            let release = releases.find((candidate) =>
              candidate.tag_name === dateTag || candidate.tag_name.startsWith(`${dateTag}-`)
            );
            const tag = release ? release.tag_name : dateTag;

            if (release) {
              ({ data: release } = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                target_commitish: context.sha,
                name: process.env.RELEASE_TITLE,
                body: `Automated build for ${process.env.RELEASE_DATE}.`,
                draft: false,
                prerelease: false,
              }));
              console.log(`Updating existing release ${tag} for ${process.env.RELEASE_DATE}.`);
            } else {
              ({ data: release } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: process.env.RELEASE_TITLE,
                body: `Automated build for ${process.env.RELEASE_DATE}.`,
                draft: false,
                prerelease: false,
              }));
              console.log(`Created release ${tag} for ${process.env.RELEASE_DATE}.`);
            }

            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `tags/${tag}`,
              sha: context.sha,
              force: true,
            });

            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });

            for (const file of files) {
              const existing = existingAssets.find((asset) => asset.name === file);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: existing.id,
                });
              }

              const filePath = path.join("release", file);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: file,
                data,
                headers: {
                  "content-type": file.endsWith(".tar.xz")
                    ? "application/x-xz"
                    : file.endsWith(".7z")
                      ? "application/x-7z-compressed"
                      : "application/octet-stream",
                  "content-length": data.length,
                },
              });
              console.log(`Uploaded ${file}`);
            }
