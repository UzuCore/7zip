name: Build 7-Zip

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build ALZ and EGG decoder
        run: |
          cmake -S CPP/7zip/Archive/AlzEgg/third_party/unegg -B CPP/7zip/Archive/AlzEgg/third_party/unegg/build -DCMAKE_BUILD_TYPE=Release
          cmake --build CPP/7zip/Archive/AlzEgg/third_party/unegg/build --parallel 2

      - name: Build 7zz
        run: make -j2 -f makefile.gcc
        working-directory: CPP/7zip/Bundles/Alone2

      - name: Stage build artifact
        run: |
          mkdir -p dist/linux-x64
          cp CPP/7zip/Bundles/Alone2/_o/7zz dist/linux-x64/
          cp DOC/License.txt DOC/copying.txt DOC/unRarLicense.txt dist/linux-x64/
          cp CPP/7zip/Archive/AlzEgg/third_party/unegg/LICENSE.txt dist/linux-x64/UnEGG-LICENSE.txt

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: 7zip-linux-x64
          path: dist/linux-x64/
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build 7zz.exe, 7z.dll, and 7zFM.exe
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $vswhere = Join-Path $programFilesX86 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vsPath) {
            throw 'MSVC x64 tools were not found on the runner.'
          }

          $env:VCVARS = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path -LiteralPath $env:VCVARS)) {
            throw "Visual Studio developer setup script was not found: $env:VCVARS"
          }

          $buildScript = Join-Path $env:RUNNER_TEMP 'build-7zip-x64.cmd'
          $scriptText = @'
          @echo off
          call "%VCVARS%" x64
          if errorlevel 1 exit /b 1
          cd /d "%GITHUB_WORKSPACE%\CPP\7zip\Archive\AlzEgg\third_party\unegg"
          if errorlevel 1 exit /b 1
          cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          if errorlevel 1 exit /b 1
          cmake --build build --parallel 2
          if errorlevel 1 exit /b 1
          cd /d "%GITHUB_WORKSPACE%\CPP\7zip\Bundles\Alone2"
          if errorlevel 1 exit /b 1
          nmake /nologo /f makefile PLATFORM=x64
          if errorlevel 1 exit /b 1
          cd /d "%GITHUB_WORKSPACE%\CPP\7zip\Bundles\Format7zF"
          if errorlevel 1 exit /b 1
          nmake /nologo /f makefile PLATFORM=x64
          if errorlevel 1 exit /b 1
          cd /d "%GITHUB_WORKSPACE%\CPP\7zip\UI\FileManager"
          if errorlevel 1 exit /b 1
          nmake /nologo /f makefile PLATFORM=x64
          if errorlevel 1 exit /b 1
          '@
          [IO.File]::WriteAllText($buildScript, $scriptText, [Text.Encoding]::ASCII)

          & $env:ComSpec /d /c $buildScript
          if ($LASTEXITCODE -ne 0) {
            throw "Windows build failed with exit code $LASTEXITCODE."
          }

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'dist\windows-x64'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item 'CPP\7zip\Bundles\Alone2\x64\7zz.exe' $artifactDir
          Copy-Item 'CPP\7zip\Bundles\Format7zF\x64\7z.dll' $artifactDir
          Copy-Item 'CPP\7zip\UI\FileManager\x64\7zFM.exe' $artifactDir
          Copy-Item 'DOC\License.txt' $artifactDir
          Copy-Item 'DOC\copying.txt' $artifactDir
          Copy-Item 'DOC\unRarLicense.txt' $artifactDir
          Copy-Item 'CPP\7zip\Archive\AlzEgg\third_party\unegg\LICENSE.txt' (Join-Path $artifactDir 'UnEGG-LICENSE.txt')

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: 7zip-windows-x64
          path: dist/windows-x64/
          if-no-files-found: error
          retention-days: 14
